mqtt:
  host: "localhost"
  port: 1883
  topic: "rig/telemetry"
  status_topic: "rig/status"
  cmd_topic: "rig/cmd"

database:
  uri: "mongodb://localhost:27017"
  name: "water_leak_detection"

hydraulics:
  # The physical Branch A/B flows rejoin before Q_out, so Q_branch is a
  # localization/demand signal and must not be subtracted a second time.
  topology: "recombined_branch"
  zero_leak_bias_lpm: 0.02

# Per-detector tuning (sigma, persistence, thresholds) lives in
# backend/config/thresholds.yaml, not here — a "detector:" block used to be
# duplicated in both files with DIFFERENT values (this file had
# persistence_seconds=10, thresholds.yaml has 5; this file had bias_lpm=0.10,
# CalibrationRepository has 0.02), and nothing ever actually read this file's
# copy. Removed to stop that drift. thresholds.yaml + CalibrationRepository
# are the only things DetectorManager actually loads.
