# Infrastructure configuration.
#
# SCOPE: MQTT connection only. Detector tuning lives in thresholds.yaml and
# database connection comes from the environment — see the notes below.
#
# This file previously also carried `database:` and `detector:` blocks that
# nothing read. They silently disagreed with the values actually in force
# (persistence 10 here vs 5 in thresholds.yaml; cusum h 3.0 here vs 5.0 there),
# so editing them appeared to work and changed nothing. They have been removed
# rather than reconciled, so there is exactly one source of truth per concern.

mqtt:
  host: "localhost"
  port: 1883
  topic: "rig/telemetry"
  status_topic: "rig/status"
  cmd_topic: "rig/cmd"
  username: ""
  password: ""

# DATABASE — not configured here.
#   backend/repositories/db.py reads MONGO_URI plus MONGO_DB_LIVE/MONGO_DB_MOCK,
#   defaulting to jal_netra_live and jal_netra_mock. See .env.example.
#
# DETECTOR THRESHOLDS — not configured here.
#   backend/detectors/detector_manager.py reads backend/config/thresholds.yaml.
#   Edit that file to retune detection.
