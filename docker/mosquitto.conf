# Mosquitto config for local development only.
#
# Mosquitto 2.x binds to loopback inside the container and rejects anonymous
# clients by default, which would make the published 1883 port unreachable from
# the host. Both are relaxed here deliberately: this broker carries nothing but
# synthetic rig telemetry on a developer machine.
#
# Do NOT reuse this file for anything reachable off localhost — add listener
# authentication and TLS first.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
